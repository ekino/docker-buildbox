versions:
  "1":
    platforms:
      - linux/amd64
      - linux/arm64
    github_versions:
      CLI_VERSION:
        repo: platformsh/cli
        rule: latest_tag
      UV_VERSION: astral-sh/uv
    test_config:
      cmd:
        - git --version
        - upsun --version
        - platform --version
        - python --version
        - pip --version
        - pipenv --version
        - uv --version
