name: Build and test images

on:
  # push is limited to master on purpose. An unfiltered push trigger fired a
  # second, identical run for every branch push that already had a pull request
  # open - same matrix, same builds, nothing published either time - and fired a
  # full run for tag pushes, which publish nothing because only the release
  # event sets a tag. Use workflow_dispatch to build a branch with no pull
  # request open.
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  release:
    types: [published]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      publish_tag:
        description: >-
          Publish under this throwaway tag instead of not publishing at all.
          Leave empty to build and test only. A branch run is not on master, so
          this is the only way to exercise the push and merge path before
          merging - use something like "rollout-test", verify with
          `docker buildx imagetools inspect ekino/ci-aws:rollout-test`, then
          delete the tags.
        required: false
        default: ""

concurrency:
  # event_name stays in the group: it keeps the nightly run from cancelling a
  # master build, since both are refs/heads/master.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:

  generate_matrix:
    runs-on: ubuntu-24.04
    # Only needs to read the repository to diff it.
    permissions:
      contents: read
    if: github.actor != 'dependabot[bot]' || github.event_name == 'pull_request'
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      # Version resolution now happens here, so this is the only job that holds
      # the API token. This token grants nothing beyond reading public metadata,
      # expires within the hour, and the action revokes it when the job ends. It
      # is deliberately not GITHUB_TOKEN, which is capped at 1000 requests/hour
      # per repository.
      - name: Mint a scoped token for the GitHub API version lookups
        id: gh_api_token
        # A fork pull request gets no secrets, so app-id is empty and this
        # action treats that as a hard error. That must not fail the run.
        # version_resolver already reads an empty bearer token as no header at
        # all and resolves anonymously, which the 60/hour anonymous limit
        # accommodates now that its response cache makes a full matrix 19
        # requests. Nothing else in a pull request run needs a credential: the
        # build jobs load the image locally, test it and push nothing.
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-metadata: read
      # Emits both matrices - one build entry per (image, version, platform) and
      # one merge entry per (image, version) - and resolves every tool version
      # the selected images need, once for the whole run. Resolving per job
      # instead meant 90 API requests for a full matrix once the architecture
      # split doubled the job count, and let the two architectures of one image
      # pick up different versions.
      - name: Run script
        id: run_script
        env:
          # Read by src/version_resolver.py. It never reaches a build, so
          # nothing running inside an image can see it.
          GH_AUTH_HEADER: "Authorization: Bearer ${{ steps.gh_api_token.outputs.token }}"
        run: |
          matrix="$(uv run --frozen python matrix_generator.py --versions-file versions.json)"
          echo "build=$(echo "$matrix" | jq -c .build)" >> "$GITHUB_OUTPUT"
          echo "merge=$(echo "$matrix" | jq -c .merge)" >> "$GITHUB_OUTPUT"
      - name: Upload the resolved versions for the build jobs
        uses: actions/upload-artifact@v4
        with:
          name: resolved-versions
          path: versions.json
          retention-days: 1

      # Decided once, here, so the build steps, the merge job and
      # image_builder.py cannot disagree about whether this run publishes.
      # Mirrors config.is_publishing.
      - name: Decide whether this run publishes
        id: publishing
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PUBLISH_TAG: ${{ inputs.publish_tag }}
        run: |
          if [ -n "$PUBLISH_TAG" ] \
            || [ "$EVENT" = "release" ] \
            || [ "$EVENT" = "schedule" ] \
            || { [ "$EVENT" != "pull_request" ] && [ "$REF" = "refs/heads/master" ]; }; then
            echo "publishing=true" >> "$GITHUB_OUTPUT"
          else
            echo "publishing=false" >> "$GITHUB_OUTPUT"
          fi

    outputs:
      build: ${{ steps.run_script.outputs.build }}
      merge: ${{ steps.run_script.outputs.merge }}
      publishing: ${{ steps.publishing.outputs.publishing }}

  build:
    # One architecture per job, on a runner of that architecture. QEMU is gone:
    # emulated arm64 builds intermittently died of SIGILL inside npm, and
    # BuildKit never noticed the child had gone, so the job ran silent to
    # GitHub's 6-hour ceiling.
    runs-on: ${{ matrix.runner }}
    name: build ${{ matrix.image }} ${{ matrix.version }} (${{ matrix.arch }})
    # GITHUB_TOKEN is used to log in to ghcr.io and push, so keep it to the
    # minimum this job actually needs. A pull request run pushes nothing and
    # needs no credentials at all.
    permissions:
      contents: read
      packages: write
    if: (github.actor != 'dependabot[bot]' || github.event_name == 'pull_request') && fromJSON(needs.generate_matrix.outputs.build).include[0]
    needs: generate_matrix
    # #2021 capped this at 120 minutes to bound the QEMU wedges, and said to
    # tighten it once post-optimisation durations were known. They are: with
    # emulation gone the slowest of the 54 jobs is 6 minutes (run 33848464523),
    # against 40 before. 90 leaves an order of magnitude of headroom for the
    # push a publishing run adds, while still turning a hang into a rerunnable
    # failure instead of an occupied runner.
    timeout-minutes: 90

    strategy:
      matrix: ${{fromJSON(needs.generate_matrix.outputs.build)}}
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Fetch the versions resolved for this run
        uses: actions/download-artifact@v8
        with:
          name: resolved-versions
      # On a publishing run this pushes a per-arch staging tag and tests that
      # tag; otherwise it loads the image locally, tests it, and pushes nothing.
      - name: Build and test image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          # Used to log in to ghcr.io and push, nothing else.
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          # Empty for every trigger but a workflow_dispatch that asked for it.
          PUBLISH_TAG: ${{ inputs.publish_tag }}
        run: |
          uv run --frozen python image_builder.py build -d \
            --image ${{ matrix.image }} \
            --version ${{ matrix.version }} \
            --platform ${{ matrix.platform }} \
            --versions-file versions.json
      # Only reached when the step above succeeded, which means this
      # architecture built AND its tests passed. The merge job requires one
      # marker per configured platform before it will publish, because the
      # staging tag alone proves nothing: the publishing path pushes before it
      # tests, so the tag can hold an image whose tests then failed, and a tag
      # left by last night's run outlives a build that fails before pushing.
      - name: Record that this architecture passed
        if: needs.generate_matrix.outputs.publishing == 'true'
        run: |
          mkdir -p markers
          echo "${{ matrix.platform }} passed in run ${{ github.run_id }}" > "markers/${{ matrix.arch }}"
      - name: Upload the marker for the merge job
        if: needs.generate_matrix.outputs.publishing == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tested-${{ matrix.image }}-${{ matrix.version }}-${{ matrix.arch }}
          path: markers/${{ matrix.arch }}
          retention-days: 1

  merge:
    # Assembles the per-arch staging tags each build job pushed into the
    # multi-arch tag users pull. Only publishing runs have anything to merge;
    # image_builder.py merge is the source of truth for that and no-ops
    # otherwise, but the condition below keeps a pull request from queueing 27
    # jobs that would do nothing.
    runs-on: ubuntu-24.04
    name: merge ${{ matrix.image }} ${{ matrix.version }}
    permissions:
      contents: read
      packages: write
    needs: [generate_matrix, build]
    # !cancelled() rather than success(): fail-fast is off, so one image failing
    # to build must not skip the merge of the other 26. Each merge verifies its
    # own sources exist, so a broken image fails only its own job. Using
    # !cancelled() instead of always() still skips the merges when a run is
    # cancelled, where publishing half a matrix is never what was wanted - and
    # generate_matrix must still be checked explicitly, because !cancelled()
    # would otherwise let this run with an empty matrix output that fromJSON
    # cannot parse. The pull request case is excluded further down, so unlike
    # the build job this needs no exception for dependabot pull requests.
    if: |
      !cancelled()
      && needs.generate_matrix.result == 'success'
      && github.actor != 'dependabot[bot]'
      && fromJSON(needs.generate_matrix.outputs.merge).include[0]
      && needs.generate_matrix.outputs.publishing == 'true'
    timeout-minutes: 15

    strategy:
      matrix: ${{fromJSON(needs.generate_matrix.outputs.merge)}}
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      # One artifact per architecture that passed. continue-on-error because a
      # pattern that matches nothing is an error here, and image_builder.py says
      # which architectures are missing far more clearly than that would.
      - name: Collect the markers from the build jobs
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: tested-${{ matrix.image }}-${{ matrix.version }}-*
          path: markers
          merge-multiple: true
      - name: Merge per-arch tags into the multi-arch image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          PUBLISH_TAG: ${{ inputs.publish_tag }}
        run: |
          uv run --frozen python image_builder.py merge -d \
            --image ${{ matrix.image }} \
            --version ${{ matrix.version }}
