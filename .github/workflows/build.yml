name: Build and test images

on:
  # push is limited to master on purpose. An unfiltered push trigger fired a
  # second, identical run for every branch push that already had a pull request
  # open - same matrix, same builds, nothing published either time - and fired a
  # full run for tag pushes, which publish nothing because only the release
  # event sets a tag. Use workflow_dispatch to build a branch with no pull
  # request open.
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  release:
    types: [published]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  # event_name stays in the group: it keeps the nightly run from cancelling a
  # master build, since both are refs/heads/master.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:

  generate_matrix:
    runs-on: ubuntu-24.04
    # Only needs to read the repository to diff it.
    permissions:
      contents: read
    if: github.actor != 'dependabot[bot]' || github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.11
      - name: Set up Pipenv
        run: |
          pip install pip pipenv
          pipenv sync
      - name: Run script
        id: run_script
        run: echo "::set-output name=matrix::$(pipenv run python matrix_generator.py)"

    outputs:
      matrix: ${{ steps.run_script.outputs.matrix }}

  build:
    runs-on: ubuntu-24.04
    # A QEMU-emulated arm64 step that dies of SIGILL does not fail the build, it
    # wedges it: BuildKit never notices, and the job runs to GitHub's 6 hour
    # ceiling. Two nightlies have burned 360 minutes that way. The slowest
    # legitimate job is around 40 minutes, and was 80 before the publishing
    # build started reusing the tested layers, so this leaves ample headroom
    # while turning a wedge into a failure you can rerun.
    timeout-minutes: 120
    # GITHUB_TOKEN is used to log in to ghcr.io and push, so keep it to the
    # minimum this job actually needs.
    permissions:
      contents: read
      packages: write
    if: (github.actor != 'dependabot[bot]' || github.event_name == 'pull_request') && fromJSON(needs.generate_matrix.outputs.matrix).include[0]
    needs: generate_matrix

    strategy:
      matrix: ${{fromJSON(needs.generate_matrix.outputs.matrix)}}
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.11
      - name: Set up Pipenv
        run: |
          pip install pip pipenv
          pipenv sync
      # image_builder.py resolves tool versions from the GitHub API, which allows
      # only 60 requests/hour unauthenticated. This token lifts that to
      # 5000/hour and is deliberately not GITHUB_TOKEN: it grants nothing beyond
      # reading public metadata, expires within the hour, and the action revokes
      # it once the job ends.
      - name: Mint a scoped token for the GitHub API version lookups
        id: gh_api_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-metadata: read
      - name: Build and tests images
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          # Used to log in to ghcr.io and push, nothing else.
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          # Read by src/version_resolver.py. It never reaches the builds, so
          # nothing running inside an image can see it.
          GH_AUTH_HEADER: "Authorization: Bearer ${{ steps.gh_api_token.outputs.token }}"
        run: |
          pipenv run python image_builder.py build -d --image ${{ matrix.image }} --version ${{ matrix.version }}
