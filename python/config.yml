platforms: &platforms
  - linux/amd64
  - linux/arm64

test_config: &test_config
  cmd:
    - pip --version
    - python --version
    - aws --version
    - poetry --version
    - uv --version

build_args: &build_args
  POETRY_HOME: "/usr/local"

github_versions: &github_versions
  UV_VERSION: astral-sh/uv

versions:
  "3.10":
    build_args: *build_args
    github_versions: *github_versions
    platforms: *platforms
    test_config: *test_config
  "3.11":
    build_args: *build_args
    github_versions: *github_versions
    platforms: *platforms
    test_config: *test_config
  "3.12":
    build_args: *build_args
    github_versions: *github_versions
    platforms: *platforms
    test_config: *test_config
  "3.13":
    build_args: *build_args
    github_versions: *github_versions
    platforms: *platforms
    test_config:
      cmd:
        - pip --version
        - python --version
        - aws --version
        - poetry --version
        - uv --version
        - psql --version
  "3.14":
    build_args: *build_args
    github_versions: *github_versions
    platforms: *platforms
